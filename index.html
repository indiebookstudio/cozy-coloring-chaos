  <!-- Open Graph / Social Sharing (TikTok, Instagram, WhatsApp, FB) -->
  <meta property="og:type" content="website">
  <meta id="og-title" property="og:title" content="Cozy Coloring Chaos | Cozy, Dark & Funny Coloring Books">
  <meta id="og-desc" property="og:description" content="Cozy coloring. Dark humor. Beautiful chaos. Official coloring books collection.">
  <meta property="og:image" content="assets/Innocent.Paws/Front.Cover.png">
  <meta property="og:site_name" content="Cozy Coloring Chaos">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta id="twitter-title" property="twitter:title" content="Cozy Coloring Chaos | Cozy, Dark & Funny Coloring Books">
  <meta id="twitter-desc" property="twitter:description" content="Cozy coloring. Dark humor. Beautiful chaos. Explore our books on Amazon.">

  <!-- Google Fonts: Bricolage Grotesque (Bold Modern Display) & Plus Jakarta Sans (Crisp Modern Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lively background ambient gradients -->
  <div class="bg-ambience" aria-hidden="true"></div>

  <div class="site-wrapper">
    <!-- ============================================
         HEADER SECTION
         ============================================ -->
    <header class="site-header">
      <!-- Top Navigation: Interface Language Switcher -->
      <div class="top-nav-bar">
        <div class="lang-switcher" role="group" aria-label="Language Selector">
          <button type="button" class="lang-btn" data-lang="it" aria-pressed="false" title="Passa all'Italiano">
            <span class="lang-flag" aria-hidden="true">🇮🇹</span>
            <span class="lang-code">IT</span>
          </button>
          <div class="lang-divider" aria-hidden="true"></div>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false" title="Switch to English">
            <span class="lang-flag" aria-hidden="true">🇬🇧</span>
            <span class="lang-code">EN</span>
          </button>
        </div>
      </div>

      <div class="header-inner">
        <!-- Brand Title -->
        <h1 class="brand-title">COZY COLORING CHAOS</h1>
        
        <!-- Brand Tagline -->
        <p class="brand-subtitle" data-i18n="brandSubtitle">Colorare cozy. Umorismo nero. Splendido caos.</p>
      </div>
    </header>

    <!-- ============================================
         MAIN CONTENT: BOOKS SHOWCASE
         ============================================ -->
    <main class="main-content">
      <section class="catalog-section" aria-labelledby="catalog-heading">
        
        <div class="section-header">
          <h2 id="catalog-heading" class="section-title" data-i18n="sectionTitle">SCEGLI IL TUO CAOS</h2>
          <div class="title-accent-pill" aria-hidden="true"></div>
        </div>

        <!-- Book Language Filter Pills -->
        <div class="book-filters-container">
          <div class="book-filters" role="tablist" aria-label="Filtra libri per lingua">
            <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
              <span class="filter-icon" aria-hidden="true">✨</span>
              <span class="filter-text" data-i18n="filterAll">Tutti</span>
              <span class="filter-count" id="count-all">0</span>
            </button>
            <button type="button" class="filter-btn" data-filter="it" role="tab" aria-selected="false">
              <span class="filter-icon" aria-hidden="true">🇮🇹</span>
              <span class="filter-text" data-i18n="filterIt">Italiano</span>
              <span class="filter-count" id="count-it">0</span>
            </button>
            <button type="button" class="filter-btn" data-filter="en" role="tab" aria-selected="false">
              <span class="filter-icon" aria-hidden="true">🇬🇧</span>
              <span class="filter-text" data-i18n="filterEn">English</span>
              <span class="filter-count" id="count-en">0</span>
            </button>
          </div>
        </div>

        <!-- Book Cards Container (Populated dynamically by script.js) -->
        <div id="books-grid" class="books-grid" role="list">
          <noscript>
            <div class="noscript-card">
              <p>Please enable JavaScript to view our coloring books catalog.</p>
            </div>
          </noscript>
        </div>

      </section>
    </main>

    <!-- ============================================
         FOOTER SECTION
         ============================================ -->
    <footer class="site-footer">
      <div class="footer-inner">
        <!-- TikTok Social CTA Button -->
        <div class="footer-social-wrapper">
          <a href="https://www.tiktok.com/@cozycoloringchaos" target="_blank" rel="noopener noreferrer" class="tiktok-pill-btn" aria-label="Segui @cozycoloringchaos su TikTok">
            <div class="tiktok-icon-wrapper" aria-hidden="true">
              <svg class="tiktok-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68 6.34 6.34 0 0 0 9.35 22a6.33 6.33 0 0 0 6.33-6.33V8.87a8.16 8.16 0 0 0 4.91 1.62V7.05a4.85 4.85 0 0 1-1-.36z"/>
              </svg>
            </div>
            <div class="tiktok-btn-content">
              <span class="tiktok-label" data-i18n="followTikTok">Seguici su TikTok</span>
              <span class="tiktok-handle">@cozycoloringchaos</span>
            </div>
            <svg class="tiktok-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>
        </div>

        <p class="footer-tagline" data-i18n="footerTagline">Creato per chi ama i libri da colorare un po' fuori dagli schemi. ✨</p>
        <p class="footer-copy">&copy; <span id="current-year"></span> Cozy Coloring Chaos. <span data-i18n="footerCopyright">Tutti i diritti riservati.</span></p>
      </div>
    </footer>
  </div>

  <!-- Dynamic Book Catalog Loader & Marketplace Handler -->
  <script src="script.js"></script>
</body>
</html>
